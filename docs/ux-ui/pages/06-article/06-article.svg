<circle cx="290" cy="551" r="3" fill="#4F46E5"/>
<text id="rule-1" x="306" y="555" font-size="13" font-weight="500" fill="#172033">Access token живёт не более 15 минут.</text>

<circle cx="290" cy="585" r="3" fill="#4F46E5"/>
<text id="rule-2" x="306" y="589" font-size="13" font-weight="500" fill="#172033">Refresh token хранится только в защищённом хранилище.</text>

<circle cx="290" cy="619" r="3" fill="#4F46E5"/>
<text id="rule-3" x="306" y="623" font-size="13" font-weight="500" fill="#172033">Каждый refresh выполняет rotation.</text>

