<title>Журнал аудита — системные события рабочего пространства</title>
<desc>Экран «Журнал аудита»: строка фильтров с поиском и чипами, кнопка «Экспорт», таблица из восьми событий (время, участник, действие, объект, IP-адрес), пагинация и пояснение о неизменяемости журнала. Термин «IP-адрес» оставлен латиницей как техническое обозначение протокола.</desc>

