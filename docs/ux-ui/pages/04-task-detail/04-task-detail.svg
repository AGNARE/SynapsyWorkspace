<text id="description-p1" x="284" y="256" font-size="13" font-weight="500" fill="#172033">Добавить JWT-аутентификацию для API и подготовить поток обновления</text>
<text id="description-p2" x="284" y="276" font-size="13" font-weight="500" fill="#172033">токенов без повторной авторизации пользователя.</text>
<text id="description-p3" x="284" y="308" font-size="13" font-weight="500" fill="#172033">Токен доступа живёт 15 минут, токен обновления — 30 дней. Rotation обязателен</text>
<text id="description-p4" x="284" y="328" font-size="13" font-weight="500" fill="#172033">при каждом обновлении, чтобы старый токен нельзя было использовать повторно.</text>
