<text id="unavailable-title" x="284" y="468" font-size="15" font-weight="700" fill="#172033">Что стало недоступно</text>
<text id="unavailable-hint" x="284" y="488" font-size="12" font-weight="500" fill="#64748B">В архивном состоянии не работают изменяющие действия, чтение и поиск работают как прежде</text>

<circle cx="290" cy="524" r="3" fill="#94A3B8"/>
<text id="unavailable-1" x="304" y="528" font-size="13" font-weight="500" fill="#172033">Изменение задач: создание, редактирование, смена статуса и исполнителя</text>

<circle cx="290" cy="556" r="3" fill="#94A3B8"/>
<text id="unavailable-2" x="304" y="560" font-size="13" font-weight="500" fill="#172033">Редактирование статей Wiki и файлов, загрузка новых версий</text>

<circle cx="290" cy="588" r="3" fill="#94A3B8"/>
<text id="unavailable-3" x="304" y="592" font-size="13" font-weight="500" fill="#172033">Запуск индексации и обновление контекста для AI-ассистента</text>

<circle cx="290" cy="620" r="3" fill="#94A3B8"/>
<text id="unavailable-4" x="304" y="624" font-size="13" font-weight="500" fill="#172033">Приглашение участников и изменение ролей доступа</text>
</g>

