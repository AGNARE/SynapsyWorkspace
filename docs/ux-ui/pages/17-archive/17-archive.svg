<rect x="712" y="772" width="1" height="86" fill="#E2E8F0"/>
<text id="delete-scope-title" x="744" y="804" font-size="13" font-weight="700" fill="#172033">Что удаляется вместе с пространством</text>
<text id="delete-scope-1" x="744" y="828" font-size="12" font-weight="500" fill="#64748B">Задачи, статьи Wiki, файлы и их версии</text>
<text id="delete-scope-2" x="744" y="850" font-size="12" font-weight="500" fill="#64748B">Журнал аудита, настройки модулей и подключение Git</text>
</g>

<text id="archive-note" x="264" y="960" font-size="12" font-weight="500" fill="#64748B">Архивация и удаление — разные действия: архив можно восстановить в течение 14 дней, удаление необратимо.</text>
</g>
