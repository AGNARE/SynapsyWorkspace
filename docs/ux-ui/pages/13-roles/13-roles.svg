<text id="roles-note-title" x="284" y="690" font-size="13" font-weight="700" fill="#172033">Системные роли</text>
<text id="roles-note-text-1" x="284" y="712" font-size="12" font-weight="500" fill="#64748B">Системные роли изменять нельзя.</text>
<text id="roles-note-text-2" x="284" y="732" font-size="12" font-weight="500" fill="#64748B">Пользовательские роли собираются</text>
<text id="roles-note-text-3" x="284" y="750" font-size="12" font-weight="500" fill="#64748B">из атомарных прав на ресурсы.</text>
</g>

<text id="roles-footer-note" x="264" y="822" font-size="12" font-weight="500" fill="#64748B">Системные роли заданы платформой и не редактируются. Пользовательские роли собираются из атомарных прав на ресурсы.</text>
</g>
</svg>
