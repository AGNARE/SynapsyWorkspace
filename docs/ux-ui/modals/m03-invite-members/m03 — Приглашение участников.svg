<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, sans-serif">
  <title>Приглашение участников</title>
  <desc>Модальное окно приглашения участников в рабочее пространство Synapse</desc>
  <g id="overlay">
    <rect id="backdrop" x="0" y="0" width="1440" height="1024" fill="#172033" fill-opacity="0.45"/>
    <g id="dialog">
      <rect id="dialog-panel" x="440" y="209" width="560" height="606" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text id="dialog-title" x="464" y="252" fill="#172033" font-size="18" font-weight="700">Пригласить участников</text>
      <text id="dialog-subtitle" x="464" y="274" fill="#64748B" font-size="13" font-weight="500">Ссылка приглашения действует 7 дней</text>
      <rect id="btn-close" x="944" y="233" width="32" height="32" rx="8" fill="#FFFFFF"/>
      <line id="close-icon-a" x1="953" y1="242" x2="967" y2="256" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
      <line id="close-icon-b" x1="967" y1="242" x2="953" y2="256" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
      <line id="dialog-divider" x1="440" y1="291" x2="1000" y2="291" stroke="#F1F5F9" stroke-width="1"/>
      <rect id="notice-access" x="464" y="315" width="512" height="60" rx="8" fill="#EEF2FF"/>
      <text id="notice-access-text-1" x="480" y="339" fill="#172033" font-size="12" font-weight="500">Владелец получает полный доступ, включая архивацию и</text>
      <text id="notice-access-text-2" x="480" y="357" fill="#172033" font-size="12" font-weight="500">удаление пространства</text>
      <g id="invite-rows">
        <text id="label-email-1" x="464" y="415" fill="#172033" font-size="12" font-weight="600">Почта</text>
        <text id="label-role-1" x="764" y="415" fill="#172033" font-size="12" font-weight="600">Роль</text>
        <rect id="field-email-1" x="464" y="423" width="280" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text id="value-email-1" x="476" y="446" fill="#172033" font-size="13" font-weight="500">a.ivanova@kstu.local</text>
        <rect id="select-role-1" x="764" y="423" width="136" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text id="value-role-1" x="776" y="446" fill="#172033" font-size="13" font-weight="500">Редактор</text>
        <path id="chevron-role-1" d="M 880 439 L 884 443 L 888 439" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect id="btn-remove-1" x="944" y="425" width="32" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <rect id="trash-1-lid" x="952" y="433" width="12" height="2" rx="1" fill="#64748B"/>
        <rect id="trash-1-handle" x="956" y="430" width="4" height="2" rx="1" fill="#64748B"/>
        <path id="trash-1-body" d="M 954 437 L 962 437 L 961 447 L 955 447 Z" fill="#64748B"/>
        <text id="label-email-2" x="464" y="487" fill="#172033" font-size="12" font-weight="600">Почта</text>
        <text id="label-role-2" x="764" y="487" fill="#172033" font-size="12" font-weight="600">Роль</text>
        <rect id="field-email-2" x="464" y="495" width="280" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text id="value-email-2" x="476" y="518" fill="#172033" font-size="13" font-weight="500">d.sidorov@kstu.local</text>
        <rect id="select-role-2" x="764" y="495" width="136" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text id="value-role-2" x="776" y="518" fill="#172033" font-size="13" font-weight="500">Читатель</text>
        <path id="chevron-role-2" d="M 880 511 L 884 515 L 888 511" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect id="btn-remove-2" x="944" y="497" width="32" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <rect id="trash-2-lid" x="952" y="505" width="12" height="2" rx="1" fill="#64748B"/>
        <rect id="trash-2-handle" x="956" y="502" width="4" height="2" rx="1" fill="#64748B"/>
        <path id="trash-2-body" d="M 954 509 L 962 509 L 961 519 L 955 519 Z" fill="#64748B"/>
        <text id="label-email-3" x="464" y="559" fill="#172033" font-size="12" font-weight="600">Почта</text>
        <text id="label-role-3" x="764" y="559" fill="#172033" font-size="12" font-weight="600">Роль</text>
        <rect id="field-email-3" x="464" y="567" width="280" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text id="placeholder-email-3" x="476" y="590" fill="#94A3B8" font-size="13" font-weight="500">name@kstu.local</text>
        <rect id="select-role-3" x="764" y="567" width="136" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text id="value-role-3" x="776" y="590" fill="#172033" font-size="13" font-weight="500">Редактор</text>
        <path id="chevron-role-3" d="M 880 583 L 884 587 L 888 583" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect id="btn-remove-3" x="944" y="569" width="32" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <rect id="trash-3-lid" x="952" y="577" width="12" height="2" rx="1" fill="#64748B"/>
        <rect id="trash-3-handle" x="956" y="574" width="4" height="2" rx="1" fill="#64748B"/>
        <path id="trash-3-body" d="M 954 581 L 962 581 L 961 591 L 955 591 Z" fill="#64748B"/>
        <rect id="btn-add-row" x="464" y="627" width="140" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <line id="add-row-plus-h" x1="478" y1="645" x2="490" y2="645" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
        <line id="add-row-plus-v" x1="484" y1="639" x2="484" y2="651" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
        <text id="add-row-label" x="498" y="650" fill="#172033" font-size="13" font-weight="600">Добавить ещё</text>
      </g>
      <text id="label-message" x="464" y="703" fill="#172033" font-size="12" font-weight="600">Сообщение (необязательно)</text>
      <rect id="field-message" x="464" y="711" width="512" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text id="placeholder-message" x="476" y="734" fill="#94A3B8" font-size="13" font-weight="500">Например: присоединяйтесь к проекту Synapse</text>
      <rect id="checkbox-self-copy" x="464" y="817" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text id="label-self-copy" x="488" y="830" fill="#172033" font-size="13" font-weight="500">Отправить копию приглашения себе</text>
      <line id="footer-divider" x1="440" y1="861" x2="1000" y2="861" stroke="#E2E8F0" stroke-width="1"/>
      <rect id="btn-cancel" x="668" y="879" width="92" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text id="btn-cancel-label" x="714" y="902" text-anchor="middle" fill="#172033" font-size="13" font-weight="600">Отмена</text>
      <rect id="btn-send" x="772" y="879" width="204" height="36" rx="8" fill="#4F46E5"/>
      <text id="btn-send-label" x="874" y="902" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Отправить приглашения</text>
    </g>
  </g>
</svg>
