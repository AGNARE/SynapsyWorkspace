<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, sans-serif">
<title>Создание задачи — модальное окно</title>
<desc>Модальное окно «Новая задача» (lg, 720): название с фокусом, описание, проект и исполнитель, приоритет и срок, статус и метки, связанные знания, уведомление исполнителя. Отклонение от SPEC.md: это файл модального окна, поэтому вместо групп sidebar, topbar и content по разделу 2.3 используется оверлей — затемнение backdrop и одна группа dialog с шапкой, телом и подвалом по MODALS.md.</desc>

<rect id="backdrop" x="0" y="0" width="1440" height="1024" fill="#172033" fill-opacity="0.45"/>

<g id="dialog">
<rect id="dialog-surface" x="360" y="142" width="720" height="740" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<g id="dialog-head">
<text id="dlg-title" x="384" y="186" font-size="18" font-weight="700" fill="#172033">Новая задача</text>
<text id="dlg-subtitle" x="384" y="210" font-size="13" font-weight="500" fill="#64748B">Появится в выбранном статусе и попадёт в ленту активности</text>
<rect id="btn-close" x="1024" y="166" width="32" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<path id="btn-close-cross" d="M1032 174l16 16M1048 174l-16 16" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
<rect id="head-divider" x="360" y="230" width="720" height="1" fill="#F1F5F9"/>
</g>

<g id="dialog-body">
<g id="field-title">
<text id="label-title" x="384" y="265" font-size="12" font-weight="600" fill="#172033">Название</text>
<rect id="input-title-focus" x="385" y="275" width="670" height="34" rx="7" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
<text id="input-title-placeholder" x="397" y="297" font-size="13" font-weight="500" fill="#94A3B8">Например: обновить документацию API</text>
</g>

<g id="field-description">
<text id="label-description" x="384" y="341" font-size="12" font-weight="600" fill="#172033">Описание</text>
<rect id="input-description" x="384" y="350" width="672" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
</g>

<g id="field-project">
<text id="label-project" x="384" y="473" font-size="12" font-weight="600" fill="#172033">Проект</text>
<rect id="select-project" x="384" y="482" width="324" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="select-project-value" x="396" y="505" font-size="13" font-weight="500" fill="#94A3B8">Выберите проект</text>
<path id="select-project-chevron" d="M684 497l6 6 6-6" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="field-assignee">
<text id="label-assignee" x="732" y="473" font-size="12" font-weight="600" fill="#172033">Исполнитель</text>
<rect id="select-assignee" x="732" y="482" width="324" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="select-assignee-value" x="744" y="505" font-size="13" font-weight="500" fill="#94A3B8">Выберите исполнителя</text>
<path id="select-assignee-chevron" d="M1032 497l6 6 6-6" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="field-priority">
<text id="label-priority" x="384" y="549" font-size="12" font-weight="600" fill="#172033">Приоритет</text>
<rect id="select-priority" x="384" y="558" width="324" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="select-priority-value" x="396" y="581" font-size="13" font-weight="500" fill="#172033">Средний</text>
<path id="select-priority-chevron" d="M684 573l6 6 6-6" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="field-due">
<text id="label-due" x="732" y="549" font-size="12" font-weight="600" fill="#172033">Срок</text>
<rect id="input-due" x="732" y="558" width="324" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<rect id="input-due-icon-body" x="744" y="567" width="16" height="14" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
<path id="input-due-icon-grid" d="M744 572h16" fill="none" stroke="#64748B" stroke-width="1.4"/>
<path id="input-due-icon-pins" d="M748 564v5M756 564v5" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/>
<text id="input-due-value" x="772" y="581" font-size="13" font-weight="500" fill="#172033">12 октября 2026</text>
</g>

<g id="field-status">
<text id="label-status" x="384" y="625" font-size="12" font-weight="600" fill="#172033">Статус</text>
<rect id="select-status" x="384" y="634" width="324" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="select-status-value" x="396" y="657" font-size="13" font-weight="500" fill="#172033">К выполнению</text>
<path id="select-status-chevron" d="M684 649l6 6 6-6" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="field-labels">
<text id="label-labels" x="732" y="625" font-size="12" font-weight="600" fill="#172033">Метки</text>
<rect id="chip-release" x="732" y="636" width="67" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="chip-release-text" x="765" y="656" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">release</text>
<rect id="chip-security" x="807" y="636" width="74" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="chip-security-text" x="844" y="656" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">security</text>
<rect id="btn-add-label" x="889" y="636" width="76" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="btn-add-label-text" x="927" y="656" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="middle">Добавить</text>
</g>

<g id="field-links">
<text id="label-links" x="384" y="701" font-size="12" font-weight="600" fill="#172033">Связанные знания</text>
<rect id="btn-link" x="384" y="710" width="120" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="btn-link-text" x="444" y="733" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">Привязать</text>
<text id="links-empty" x="520" y="733" font-size="13" font-weight="500" fill="#64748B">Пока ничего не привязано — задача будет без связей в графе знаний</text>
</g>

<g id="field-notify">
<rect id="toggle-notify" x="384" y="766" width="36" height="20" rx="10" fill="#4F46E5"/>
<circle id="toggle-notify-knob" cx="410" cy="776" r="8" fill="#FFFFFF"/>
<text id="label-notify" x="432" y="781" font-size="13" font-weight="500" fill="#172033">Уведомить исполнителя</text>
</g>
</g>

<g id="dialog-foot">
<rect id="foot-divider" x="360" y="810" width="720" height="1" fill="#E2E8F0"/>
<rect id="btn-cancel" x="824" y="828" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="btn-cancel-text" x="864" y="851" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">Отмена</text>
<rect id="btn-create" x="916" y="828" width="140" height="36" rx="8" fill="#4F46E5"/>
<text id="btn-create-text" x="986" y="851" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Создать задачу</text>
</g>
</g>
</svg>
