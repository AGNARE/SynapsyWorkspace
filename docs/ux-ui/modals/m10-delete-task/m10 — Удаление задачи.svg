<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, sans-serif">
<title>Удаление задачи — модальное окно</title>
<desc>Окно sm 480, опасное действие: последствия удаления, флажок удаления вложений, опасная кнопка. Спецификация: MODALS.md, m10.</desc>

  <rect x="0" y="0" width="1440" height="1024" id="backdrop" fill="#172033" fill-opacity="0.45"/>
<g id="dialog">
