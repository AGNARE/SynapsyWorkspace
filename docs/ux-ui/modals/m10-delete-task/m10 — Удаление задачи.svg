  <text x="504" y="184" font-size="18" font-weight="700" fill="#172033">Удалить TASK-142?</text>
  <rect x="904" y="164" width="32" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M915 175l10 10M445 33l-10 10" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
