<desc>Окно lg 720: параметры пространства, срок хранения до удаления, предупреждение и список того, что перестанет работать. Спецификация: MODALS.md, m05.</desc>

  <rect x="0" y="0" width="1440" height="1024" id="backdrop" fill="#172033" fill-opacity="0.45"/>
