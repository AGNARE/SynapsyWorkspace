<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, sans-serif">
<title>Каскадное отключение модуля</title>
<desc>Модальное окно md (560): диалог «Отключить модуль «Управление задачами»?» с предупреждением о зависимых модулях Git и Gantt, пояснением о сохранности данных, флажком подтверждения и отключённой опасной кнопкой. Отклонение от SPEC.md по анатомии модалки из MODALS.md: слой только overlay, группы sidebar, topbar и content отсутствуют, подложка экрана не рисуется.</desc>

<g id="overlay">
<rect id="backdrop" x="0" y="0" width="1440" height="1024" fill="#172033" fill-opacity="0.45"/>

<g id="dialog">
<rect id="dialog-surface" x="440" y="323" width="560" height="378" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

<g id="dialog-header">
<text id="dialog-title" x="464" y="365" font-size="18" font-weight="700" fill="#172033">Отключить модуль «Управление задачами»?</text>
<rect id="btn-close" x="944" y="343" width="32" height="32" rx="8" fill="#FFFFFF"/>
<path id="close-cross" d="M952 351 L968 367 M968 351 L952 367" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
<rect id="header-divider" x="440" y="395" width="560" height="1" fill="#F1F5F9"/>
</g>

<g id="dialog-body">
<rect id="warning-block" x="464" y="419" width="512" height="112" rx="12" fill="#FEF2F2"/>
<text id="warning-title" x="480" y="448" font-size="13" font-weight="700" fill="#B91C1C">Будут отключены зависимые модули</text>

<rect id="badge-git-type" x="480" y="463" width="80" height="22" rx="999" fill="#F1F5F9"/>
<text id="badge-git-type-label" x="490" y="478" font-size="11" font-weight="600" fill="#475569">Интеграция</text>
<text id="dep-git" x="570" y="478" font-size="13" font-weight="500" fill="#172033">Git — зависит от подсистемы задач</text>

<rect id="badge-gantt-type" x="480" y="493" width="56" height="22" rx="999" fill="#F1F5F9"/>
<text id="badge-gantt-type-label" x="490" y="508" font-size="11" font-weight="600" fill="#475569">Модуль</text>
<text id="dep-gantt" x="546" y="508" font-size="13" font-weight="500" fill="#172033">Gantt — зависит от подсистемы задач</text>

<text id="explain-line-1" x="464" y="551" font-size="13" font-weight="500" fill="#172033">Данные не удаляются. При повторном включении модуля зависимые</text>
<text id="explain-line-2" x="464" y="571" font-size="13" font-weight="500" fill="#172033">модули не включатся автоматически — их нужно включить отдельно.</text>

<rect id="checkbox-ack" x="464" y="587" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="checkbox-ack-label" x="492" y="600" font-size="13" font-weight="500" fill="#172033">Я понимаю последствия отключения</text>
</g>

<g id="dialog-footer">
<rect id="footer-divider" x="440" y="629" width="560" height="1" fill="#E2E8F0"/>
<rect id="btn-cancel" x="720" y="647" width="88" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text id="btn-cancel-label" x="764" y="670" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">Отмена</text>
<rect id="btn-disable" x="820" y="647" width="156" height="36" rx="8" fill="#F1F5F9"/>
<text id="btn-disable-label" x="898" y="670" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Отключить модули</text>
</g>

</g>
</g>
</svg>
