<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, sans-serif">
  <title>Командное меню</title>
  <desc>Командная палитра 560 прижата к верху холста на y=96: строка поиска с иконкой лупы и чипом Esc, группы команд ПЕРЕЙТИ, СОЗДАТЬ, НЕДАВНЕЕ и строка подсказок клавиш. Затемнение и диалог лежат в группе overlay, подложка экрана не рисуется. Отклонения от общего контракта: внутренние отступы палитры 16 вместо 24 и высота поля поиска 40 вместо 36; символы ↑↓ в строке подсказок взяты из макета.</desc>
  <g id="overlay">
    <rect id="backdrop" x="0" y="0" width="1440" height="1024" fill="#172033" fill-opacity="0.45"/>
    <g id="dialog">
      <rect id="dialog-panel" x="440" y="96" width="560" height="620" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <g id="dialog-search">
        <rect id="search-field" x="456" y="112" width="528" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="471" cy="130" r="5" fill="none" stroke="#64748B" stroke-width="1.6"/>
        <path d="M474.6 133.6 L479 138" fill="none" stroke="#64748B" stroke-width="1.6"/>
        <text x="488" y="137" font-size="13" font-weight="500" fill="#94A3B8">Поиск или команда…</text>
        <rect id="chip-esc" x="938" y="121" width="34" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="955" y="136" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Esc</text>
        <line x1="440" y1="160" x2="1000" y2="160" stroke="#F1F5F9" stroke-width="1"/>
      </g>
      <g id="group-goto">
        <text x="456" y="177" font-size="11" font-weight="700" fill="#94A3B8">ПЕРЕЙТИ</text>
        <rect x="456" y="196" width="6.5" height="6.5" rx="1.5" fill="#64748B"/>
        <rect x="465.5" y="196" width="6.5" height="6.5" rx="1.5" fill="#64748B"/>
        <rect x="456" y="205.5" width="6.5" height="6.5" rx="1.5" fill="#64748B"/>
        <rect x="465.5" y="205.5" width="6.5" height="6.5" rx="1.5" fill="#64748B"/>
        <text x="484" y="208" font-size="13" font-weight="500" fill="#172033">Обзор</text>
        <rect id="row-tasks" x="448" y="222" width="544" height="36" rx="8" fill="#EEF2FF"/>
        <rect x="456" y="233" width="3.5" height="3.5" rx="1" fill="#4F46E5"/>
        <rect x="462" y="233.5" width="10" height="2.5" rx="1.25" fill="#4F46E5"/>
        <rect x="456" y="238.5" width="3.5" height="3.5" rx="1" fill="#4F46E5"/>
        <rect x="462" y="239" width="10" height="2.5" rx="1.25" fill="#4F46E5"/>
        <rect x="456" y="244" width="3.5" height="3.5" rx="1" fill="#4F46E5"/>
        <rect x="462" y="244.5" width="7" height="2.5" rx="1.25" fill="#4F46E5"/>
        <text x="484" y="244" font-size="13" font-weight="600" fill="#4F46E5">Задачи</text>
        <rect x="936" y="230" width="44" height="20" rx="6" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1"/>
        <text x="958" y="244" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">Enter</text>
        <rect x="457" y="268" width="3.5" height="14" rx="1.5" fill="#64748B"/>
        <rect x="462.8" y="268" width="3.5" height="9.5" rx="1.5" fill="#64748B"/>
        <rect x="468.6" y="268" width="3.5" height="12" rx="1.5" fill="#64748B"/>
        <text x="484" y="280" font-size="13" font-weight="500" fill="#172033">Kanban</text>
        <rect x="459" y="305" width="10" height="13" rx="2" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <rect x="462" y="309" width="4" height="1.4" fill="#64748B"/>
        <rect x="462" y="312.5" width="4" height="1.4" fill="#64748B"/>
        <text x="484" y="316" font-size="13" font-weight="500" fill="#172033">Wiki</text>
        <rect x="457" y="343" width="14" height="10" rx="2" fill="#64748B"/>
        <rect x="457" y="340" width="6" height="4" rx="1.5" fill="#64748B"/>
        <text x="484" y="352" font-size="13" font-weight="500" fill="#172033">Файлы</text>
      </g>
      <g id="group-create">
        <text x="456" y="383" font-size="11" font-weight="700" fill="#94A3B8">СОЗДАТЬ</text>
        <rect x="457" y="403" width="14" height="14" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <rect x="463.2" y="406.5" width="1.6" height="7" fill="#64748B"/>
        <rect x="460.5" y="409.2" width="7" height="1.6" fill="#64748B"/>
        <text x="484" y="414" font-size="13" font-weight="500" fill="#172033">Задачу</text>
        <rect x="457" y="439" width="14" height="14" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <rect x="463.2" y="442.5" width="1.6" height="7" fill="#64748B"/>
        <rect x="460.5" y="445.2" width="7" height="1.6" fill="#64748B"/>
        <text x="484" y="450" font-size="13" font-weight="500" fill="#172033">Статью</text>
        <rect x="457" y="475" width="14" height="14" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <rect x="463.2" y="478.5" width="1.6" height="7" fill="#64748B"/>
        <rect x="460.5" y="481.2" width="7" height="1.6" fill="#64748B"/>
        <text x="484" y="486" font-size="13" font-weight="500" fill="#172033">Папку</text>
        <rect x="457" y="511" width="14" height="14" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <rect x="463.2" y="514.5" width="1.6" height="7" fill="#64748B"/>
        <rect x="460.5" y="517.2" width="7" height="1.6" fill="#64748B"/>
        <text x="484" y="522" font-size="13" font-weight="500" fill="#172033">Пригласить участника</text>
      </g>
      <g id="group-recent">
        <text x="456" y="553" font-size="11" font-weight="700" fill="#94A3B8">НЕДАВНЕЕ</text>
        <rect x="456" y="573" width="3.5" height="3.5" rx="1" fill="#64748B"/>
        <rect x="462" y="573.5" width="10" height="2.5" rx="1.25" fill="#64748B"/>
        <rect x="456" y="578.5" width="3.5" height="3.5" rx="1" fill="#64748B"/>
        <rect x="462" y="579" width="10" height="2.5" rx="1.25" fill="#64748B"/>
        <rect x="456" y="584" width="3.5" height="3.5" rx="1" fill="#64748B"/>
        <rect x="462" y="584.5" width="7" height="2.5" rx="1.25" fill="#64748B"/>
        <text x="484" y="584" font-size="12" font-weight="600" fill="#4F46E5">TASK-142</text>
        <text x="550" y="584" font-size="13" font-weight="500" fill="#172033">Реализовать JWT-аутентификацию</text>
        <rect x="459" y="609" width="10" height="13" rx="2" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <rect x="462" y="613" width="4" height="1.4" fill="#64748B"/>
        <rect x="462" y="616.5" width="4" height="1.4" fill="#64748B"/>
        <text x="484" y="620" font-size="13" font-weight="500" fill="#172033">Архитектура аутентификации</text>
        <path d="M459 645 L469 645 L469 658 L459 658 Z" fill="none" stroke="#64748B" stroke-width="1.4"/>
        <path d="M464 645 L469 650 L469 645 Z" fill="#64748B"/>
        <text x="484" y="656" font-size="13" font-weight="500" fill="#172033">Спецификация API.pdf</text>
      </g>
      <g id="dialog-footer">
        <line x1="440" y1="670" x2="1000" y2="670" stroke="#E2E8F0" stroke-width="1"/>
        <text x="456" y="697" font-size="11" font-weight="500" fill="#94A3B8">↑↓ навигация · Enter выбрать · Esc закрыть</text>
      </g>
    </g>
  </g>
</svg>
