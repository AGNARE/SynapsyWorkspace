<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, sans-serif">
<title>Ошибки и недоступные состояния</title>
<desc>Лист 1440x1024: ошибка загрузки, недоступный ассистент, нет прав на действие, ошибка сохранения в форме.</desc>

<g id="content">
  <text x="64" y="66" font-size="24" font-weight="700" fill="#172033">Ошибки и недоступные состояния</text>
  <text x="64" y="94" font-size="13" font-weight="500" fill="#64748B">Каждая ошибка объясняет причину и даёт действие. Запрещённое действие объясняет, почему запрещено</text>
  <rect x="64" y="150" width="616" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="186" font-size="15" font-weight="700" fill="#172033">Ошибка загрузки данных</text>
  <rect x="88" y="214" width="40" height="40" rx="10" fill="#FEF2F2"/>
  <text x="108" y="240" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle">!</text>
  <text x="88" y="284" font-size="13" font-weight="600" fill="#172033">Не удалось загрузить список задач</text>
  <text x="88" y="308" font-size="13" font-weight="500" fill="#64748B">Сервер не ответил за 10 секунд. Данные не потеряны —</text>
  <text x="88" y="328" font-size="13" font-weight="500" fill="#64748B">попробуйте ещё раз.</text>
  <rect x="88" y="364" width="130" height="36" rx="8" fill="#4F46E5"/>
  <text x="153" y="387" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Повторить</text>
  <rect x="230" y="364" width="150" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="305" y="387" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">Скачать отчёт</text>
  <rect x="712" y="150" width="616" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="736" y="186" font-size="15" font-weight="700" fill="#172033">Ассистент недоступен</text>
  <rect x="736" y="214" width="40" height="40" rx="10" fill="#FFF7ED"/>
  <circle cx="756" cy="234" r="7" fill="none"/>
  <path d="M756 227v7M756 239v1" fill="none" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="736" y="284" font-size="13" font-weight="600" fill="#172033">Модель не отвечает</text>
  <text x="736" y="308" font-size="13" font-weight="500" fill="#64748B">Локальная модель недоступна. Остальное пространство</text>
  <text x="736" y="328" font-size="13" font-weight="500" fill="#64748B">работает: задачи, файлы и база знаний на месте.</text>
  <rect x="736" y="364" width="400" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="752" y="391" font-size="13" font-weight="500" fill="#94A3B8">Поле ввода скрыто, пока модель недоступна</text>
  <rect x="1152" y="364" width="152" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1228" y="391" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">Проверить снова</text>
  <rect x="64" y="512" width="616" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="548" font-size="15" font-weight="700" fill="#172033">Нет прав на действие</text>
  <rect x="88" y="576" width="40" height="40" rx="10" fill="#F1F5F9"/>
  <path d="M108 596v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="101" y="596" width="14" height="11" rx="2" fill="none" stroke="#475569" stroke-width="1.6"/>
  <text x="88" y="646" font-size="13" font-weight="600" fill="#172033">Удалять задачи может владелец</text>
  <text x="88" y="670" font-size="13" font-weight="500" fill="#64748B">Ваша роль — читатель. Попросите владельца выдать</text>
  <text x="88" y="690" font-size="13" font-weight="500" fill="#64748B">право на удаление в разделе «Роли и права».</text>
  <rect x="88" y="726" width="140" height="36" rx="8" fill="#F1F5F9"/>
  <text x="158" y="749" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Удалить задачу</text>
  <text x="240" y="749" font-size="12" font-weight="500" fill="#94A3B8">кнопка отключена</text>
  <rect x="712" y="512" width="616" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="736" y="548" font-size="15" font-weight="700" fill="#172033">Ошибка сохранения в форме</text>
  <rect x="736" y="568" width="568" height="52" rx="10" fill="#FEF2F2"/>
  <text x="752" y="590" font-size="13" font-weight="600" fill="#B91C1C">Не сохранилось: название уже занято</text>
  <text x="752" y="608" font-size="12" font-weight="500" fill="#B91C1C">Измените название или откройте существующее пространство.</text>
  <text x="736" y="650" font-size="12" font-weight="600" fill="#172033">Название роли</text>
  <rect x="736" y="662" width="568" height="36" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
  <text x="752" y="685" font-size="13" font-weight="600" fill="#172033">Ревьюер документации</text>
  <text x="736" y="712" font-size="12" font-weight="500" fill="#B91C1C">Такая роль уже есть в пространстве</text>
  <rect x="1104" y="748" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1144" y="771" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">Отмена</text>
  <rect x="1196" y="748" width="108" height="36" rx="8" fill="#4F46E5"/>
  <text x="1250" y="771" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Сохранить</text>
</g>
</svg>
